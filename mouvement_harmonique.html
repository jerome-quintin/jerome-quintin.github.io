<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mouvement harmonique simple — bloc-ressort</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #286047;
      --accent-dark: #244b38;
      --curve: #e37731;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      color: #1d2b37;
      background: #f2f5f2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1440px; margin: auto; padding: 48px clamp(16px, 4vw, 56px) 64px; }
    .eyebrow {
      color: var(--accent-dark); font-size: .75rem; font-weight: 800;
      letter-spacing: .14em; text-transform: uppercase;
    }
    h1 { margin: 10px 0 8px; font-size: clamp(2rem, 4vw, 3.4rem); line-height: 1.08; letter-spacing: -.04em; }
    .intro { max-width: 670px; margin: 0; color: #56636d; line-height: 1.6; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; margin-top: 32px; align-items: start; }
    .card { min-width: 0; background: #fff; border: 1px solid #e3e5e3; border-radius: 20px; box-shadow: 0 10px 35px #2333410a; }
    .plot-card { padding: clamp(16px, 2.5vw, 28px); }
    .card-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; }
    h2 { margin: 0; font-size: 1.13rem; letter-spacing: -.02em; }
    .caption { color: #687782; font-size: .82rem; }
    .plot-wrap { width: 100%; height: clamp(290px, 38vw, 480px); margin-top: 22px; }
    canvas { display: block; width: 100%; height: 100%; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 24px; padding: 12px 0 0 4px; font-size: .84rem; color: #4a5a64; }
    .legend-item { display: inline-flex; gap: 9px; align-items: center; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #2573a6; }
    .line { width: 25px; height: 3px; border-radius: 3px; background: var(--curve); }
    .formula { background: #f2f6f2; border: 1px solid #dce8dd; border-radius: 12px; padding: 15px 17px; margin-top: 22px; }
    .formula-label { font-size: .7rem; font-weight: 800; letter-spacing: .1em; color: var(--accent-dark); text-transform: uppercase; }
    .equation { margin: 7px 0 0; color: #263d30; font-size: clamp(.88rem, 1.25vw, 1.02rem); line-height: 1.5; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .equation-note { margin: 4px 0 0; color: #5b6d60; font-size: .76rem; }
    .controls { padding: 26px; }
    .controls-intro { color: #687782; font-size: .88rem; line-height: 1.5; margin: 8px 0 4px; }
    .control { border-bottom: 1px solid #edf0ef; padding: 23px 0 18px; }
    .control-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    label { font-size: .91rem; font-weight: 700; }
    output { color: var(--accent-dark); font-size: .9rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    input[type="range"] { appearance: none; -webkit-appearance: none; display: block; width: 100%; height: 64px; margin: 5px 0 0; background: transparent; cursor: pointer; touch-action: pan-y; }
    input[type="range"]::-webkit-slider-runnable-track { height: 8px; background: #cbd8ce; border-radius: 4px; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; box-sizing: border-box; width: 44px; height: 44px; margin-top: -18px; border: 2px solid white; border-radius: 50%; background: var(--accent); }
    input[type="range"]::-moz-range-track { height: 8px; background: #cbd8ce; border-radius: 4px; }
    input[type="range"]::-moz-range-thumb { box-sizing: border-box; width: 44px; height: 44px; border: 2px solid white; border-radius: 50%; background: var(--accent); }
    input[type="range"]:focus-visible, button:focus-visible, .page-nav a:focus-visible { outline: 3px solid #286d9c; outline-offset: 3px; }
    .bounds { display: flex; justify-content: space-between; color: #7e8a91; font-size: .74rem; font-variant-numeric: tabular-nums; }
    button { min-height: 44px; width: 100%; margin-top: 23px; border: 1px solid #d8dedc; border-radius: 10px; background: #fff; color: #334955; font: inherit; font-size: .87rem; font-weight: 700; cursor: pointer; }
    button:hover { background: #f5f8f7; }
    .page-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
    .page-nav a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 24px; border-radius: 10px; background: var(--accent); color: #fff; font-size: .9rem; font-weight: 700; text-decoration: none; }
    .page-nav a:hover { background: var(--accent-dark); }
    .footnote { color: #75828a; font-size: .76rem; line-height: 1.5; margin: 19px 0 0; }
    @media (max-width: 880px) {
      main { padding-top: 32px; }
      .layout { grid-template-columns: minmax(0, 1fr); margin-top: 24px; }
      .controls { padding: 22px; }
    }
    @media (max-width: 480px) {
      main { padding: 26px 12px 40px; }
      .card { border-radius: 16px; }
      .plot-card { padding: 16px 12px; }
      .plot-wrap { height: 290px; margin-top: 16px; }
      .controls { padding: 20px; }
      .legend { font-size: .78rem; }
    }
    @media (max-width: 600px) {
      main { padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
      .page-nav a { flex: 1; min-width: 0; padding: 0 8px; }
    }
    @media (max-width: 600px) and (min-height: 700px) {
      .plot-card { position: sticky; top: 8px; z-index: 1; }
      .plot-wrap { height: 220px; }
      .control { scroll-margin-top: 420px; }
    }
  </style>
</head>
<body>
  <main>
    <!--<header>
      <div class="eyebrow">Physique · oscillations</div>
      <h1>Le mouvement harmonique</h1>
      <p class="intro">Explorez le mouvement du système bloc-ressort et ajustez la courbe sinusoïdale aux données expérimentales.</p>
    </header>-->

    <div class="layout">
      <section class="card plot-card" aria-labelledby="graph-title">
        <div class="card-top">
          <h2 id="graph-title">Position en fonction du temps</h2>
          <!--<span class="caption">Mesures expérimentales et modèle</span>-->
        </div>
        <div class="plot-wrap">
          <canvas id="graph" role="img" aria-label="Graphique de la position en fonction du temps : mesures expérimentales en bleu et modèle sinusoïdal en orange."></canvas>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="dot" aria-hidden="true"></span>Données expérimentales</span>
          <span class="legend-item"><span class="line" aria-hidden="true"></span>Mouvement harmonique simple</span>
        </div>
        <div class="formula">
          <div class="formula-label">Fonction du mouvement harmonique simple</div> <!--<div class="formula-label">Fonction affichée</div>-->
          <p class="equation" id="equation"></p>
          <!--<p class="equation-note">x en mm · t en ms · ω en rad/s · φ en rad</p>-->
        </div>
      </section>

      <section class="card controls" aria-labelledby="controls-title">
        <h2 id="controls-title">Paramètres du modèle</h2>
        <p class="controls-intro">Déplacez les curseurs pour observer leur effet sur la courbe</p>
        <div class="control">
          <div class="control-head"><label for="amplitude">Amplitude <i>A</i></label><output id="amplitude-value" for="amplitude"></output></div>
          <input id="amplitude" type="range" min="10" max="75" step="0.01" value="56.81">
          <div class="bounds"><span>10 mm</span><span>75 mm</span></div>
        </div>
        <div class="control">
          <div class="control-head"><label for="frequency">Fréquence angulaire <i>ω</i></label><output id="frequency-value" for="frequency"></output></div>
          <input id="frequency" type="range" min="4.0" max="7.0" step="0.01" value="5.55">
          <div class="bounds"><span>4,0 rad/s</span><span>7,0 rad/s</span></div>
        </div>
        <div class="control">
          <div class="control-head"><label for="phase">Phase initiale <i>φ</i></label><output id="phase-value" for="phase"></output></div>
          <input id="phase" type="range" min="0" max="6.28" step="0.01" value="6.20">
          <div class="bounds"><span>0 rad</span><span>2π rad</span></div>
        </div>
        <button id="reset" type="button">Rétablir les paramètres initiaux</button>
        <!--<p class="footnote">Les valeurs initiales correspondent approximativement aux mesures. Le temps est converti en secondes dans le calcul du sinus.</p>-->
      </section>
    </div>
    <nav class="page-nav" aria-label="Navigation entre les pages">
      <a href="bloc-ressort.html">Page précédente</a>
      <a href="champ-electrique.html">Prochaine page</a>
    </nav>
  </main>

      phase: document.getElementById("phase-value")
    };
    const equation = document.getElementById("equation");
    let redrawPending = false;

    function updateLabels() {
      const amplitude = Number(sliders.amplitude.value);
      const frequency = Number(sliders.frequency.value);
      const phase = Number(sliders.phase.value);
      values.amplitude.textContent = `${amplitude.toFixed(2)} mm`;
      values.frequency.textContent = `${frequency.toFixed(2)} rad/s`;
      values.phase.textContent = `${phase.toFixed(2)} rad`;
      sliders.amplitude.setAttribute("aria-valuetext", values.amplitude.textContent);
      sliders.frequency.setAttribute("aria-valuetext", values.frequency.textContent);
      sliders.phase.setAttribute("aria-valuetext", values.phase.textContent);
      equation.textContent = "x(t) = A sin(ωt + φ)"; //equation.textContent = `x(t) = ${amplitude.toFixed(2)} sin(${frequency.toFixed(3)} × t/1000 + ${phase.toFixed(2)}) mm`;
    }

    function drawGraph() {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      const w = rect.width;
      const h = rect.height;
      const margin = { left: 48, right: 22, top: 10, bottom: 42 };
      const width = w - margin.left - margin.right;
      const height = h - margin.top - margin.bottom;
      const x = t => margin.left + (t / 18000) * width;
      const y = p => margin.top + (80 - p) / 160 * height;
      const amplitude = Number(sliders.amplitude.value);
      const frequency = Number(sliders.frequency.value);
      const phase = Number(sliders.phase.value);
      const rootStyle = getComputedStyle(document.documentElement);

      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = "#e7ecec";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#687782";
      ctx.font = `11px ${rootStyle.fontFamily}`;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (const tick of [-80, -40, 0, 40, 80]) {
        ctx.beginPath(); ctx.moveTo(margin.left, y(tick)); ctx.lineTo(w - margin.right, y(tick)); ctx.stroke();
        ctx.fillText(String(tick), margin.left - 7, y(tick));
      }
      const xTicks = w < 500 ? [0, 6000, 12000, 18000] : [0, 3000, 6000, 9000, 12000, 15000, 18000];
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for (const tick of xTicks) {
        ctx.beginPath(); ctx.moveTo(x(tick), margin.top); ctx.lineTo(x(tick), h - margin.bottom); ctx.stroke();
        ctx.fillText(String(tick), x(tick), h - margin.bottom + 7);
      }
      ctx.strokeStyle = "#aebbbd";
      ctx.strokeRect(margin.left, margin.top, width, height);
      ctx.fillStyle = "#52626b";
      ctx.font = `12px ${rootStyle.fontFamily}`;
      ctx.fillText("Temps (ms)", margin.left + width / 2, h - 15);
      ctx.save();
      ctx.translate(12, margin.top + height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText("Position (mm)", 0, 0);
      ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.rect(margin.left, margin.top, width, height); ctx.clip();
      ctx.fillStyle = "#2573a6";
      for (const [t, p] of measurements) {
        ctx.beginPath(); ctx.arc(x(t), y(p), 2.2, 0, 2 * Math.PI); ctx.fill();
      }
      ctx.strokeStyle = rootStyle.getPropertyValue("--curve").trim();
      ctx.lineWidth = 2.4;
      ctx.lineJoin = "round";
      ctx.beginPath();
      for (let i = 0; i <= 2400; i++) {
        const t = 17370 * i / 2400;
        const px = x(t);
        const py = y(amplitude * Math.sin(frequency * t / 1000 + phase));
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
    }

    function scheduleDraw() {
      updateLabels();
      if (!redrawPending) {
        redrawPending = true;
        requestAnimationFrame(() => { redrawPending = false; drawGraph(); });
      }
    }
    for (const slider of Object.values(sliders)) slider.addEventListener("input", scheduleDraw);
    document.getElementById("reset").addEventListener("click", () => {
      for (const slider of Object.values(sliders)) slider.value = slider.defaultValue;
      scheduleDraw();
    });
    new ResizeObserver(scheduleDraw).observe(canvas.parentElement);
    scheduleDraw();
  </script>
</body>
</html>
