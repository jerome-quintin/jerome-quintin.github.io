<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulation masse-ressort</title>

</head>
<body>
<main class="widget" aria-label="Simulation d'un oscillateur harmonique simple">
<div class="layout">
<section class="card stage"><div class="wrap"><canvas id="scene" role="img" aria-label="Animation de l'oscillateur et graphiques de position, vitesse et accélération"></canvas></div><div class="legend"><span><i class="swatch" style="background:#3979c6"></i>Position</span><span><i class="swatch" style="background:#c65f5a"></i>Vitesse</span><span><i class="swatch" style="background:#579064"></i>Accélération</span></div></section>
<aside class="card controls"><h2>Commandes</h2>
<div class="transport"><button type="button" id="reset" title="Retour au début" aria-label="Retour au début">↶</button><button type="button" id="backstep" title="Reculer d’un pas" aria-label="Reculer d’un pas">◀▮</button><button type="button" id="play" class="primary" title="Lecture ou pause" aria-label="Lecture" aria-pressed="false">▶</button><button type="button" id="step" title="Avancer d’un pas" aria-label="Avancer d’un pas">▮▶</button></div>
<div class="slider"><div class="slider-head"><label for="m">Masse <i>m</i></label><span class="value" id="mout"></span></div><input id="m" type="range" min="1" max="10" step="0.1" value="5"></div>
<div class="slider"><div class="slider-head"><label for="k">Constante de rappel <i>k</i></label><span class="value" id="kout"></span></div><input id="k" type="range" min="1" max="10" step="0.1" value="5"></div>
<div class="slider"><div class="slider-head"><label for="phi">Phase initiale <i>φ</i></label><span class="value" id="phiout"></span></div><input id="phi" type="range" min="0" max="6.283185307" step="0.01" value="0"></div>
</aside></div>
<nav class="next-page" aria-label="Navigation entre les pages">
  <a href="mouvement_harmonique.html">Prochaine page</a>
</nav>
</main>
<script>
(()=>{'use strict';
const widgetStyle=document.createElement("style");
widgetStyle.textContent=String.raw`
:root {
  color-scheme: light;
  --accent: #286047;
  --accent-dark: #244b38;
  font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
  color: #1d2b37;
  background: #f2f5f2;
}
* { box-sizing: border-box; }
body { margin: 0; }
.widget { max-width: 1440px; margin: auto; padding: 48px clamp(16px, 4vw, 56px) 64px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
.card { min-width: 0; background: #fff; border: 1px solid #e3e5e3; border-radius: 20px; box-shadow: 0 10px 35px #2333410a; }
.stage { padding: clamp(16px, 2.5vw, 28px); }
.wrap { width: 100%; height: 760px; }
canvas { display: block; width: 100%; height: 100%; }
.controls { padding: 26px; }
.controls h2 { margin: 0 0 16px; font-size: 1.13rem; letter-spacing: -.02em; }
.transport { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
button { min-width: 44px; min-height: 48px; border: 1px solid #d8dedc; border-radius: 10px; background: #fff; color: #334955; font: inherit; font-size: 1rem; cursor: pointer; }
button:hover { background: #f5f8f7; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { background: var(--accent-dark); }
.next-page { display: flex; justify-content: flex-end; margin-top: 20px; }
.next-page a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 24px; border-radius: 10px; background: var(--accent); color: #fff; font-size: .9rem; font-weight: 700; text-decoration: none; }
.next-page a:hover { background: var(--accent-dark); }
button:focus-visible, input:focus-visible, .next-page a:focus-visible { outline: 3px solid #286d9c; outline-offset: 3px; }
.slider { border-bottom: 1px solid #edf0ef; padding: 18px 0 12px; }
.slider:last-child { border-bottom: 0; }
.slider-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
label { font-size: .91rem; font-weight: 700; }
.value { color: var(--accent-dark); font-size: .9rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
input[type="range"] { appearance: none; -webkit-appearance: none; display: block; width: 100%; height: 64px; margin: 5px 0 0; background: transparent; cursor: pointer; touch-action: pan-y; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; background: #cbd8ce; border-radius: 4px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; box-sizing: border-box; width: 44px; height: 44px; margin-top: -18px; border: 2px solid white; border-radius: 50%; background: var(--accent); }
input[type="range"]::-moz-range-track { height: 8px; background: #cbd8ce; border-radius: 4px; }
input[type="range"]::-moz-range-thumb { box-sizing: border-box; width: 44px; height: 44px; border: 2px solid white; border-radius: 50%; background: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 24px; padding: 12px 0 0 4px; font-size: .84rem; color: #4a5a64; }
.swatch { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
@media (max-width: 880px) {
  .widget { padding-top: 32px; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .controls { order: -1; padding: 22px; }
}
@media (max-width: 480px) {
  .widget { padding: 26px 12px 40px; }
  .card { border-radius: 16px; }
  .stage { padding: 16px 12px; }
  .controls { padding: 20px; }
  .legend { font-size: .78rem; }
  .next-page a { width: 100%; }
}
@media (max-width: 600px) {
  .widget { padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .next-page a { width: 100%; }
}`;
document.head.appendChild(widgetStyle);const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);const ui={m:$('m'),k:$('k'),phi:$('phi')};let t=0,playing=false,last=performance.now();const C={x:'#3979c6',v:'#c65f5a',a:'#579064',ink:'#172033',grid:'#dfe6ef',muted:'#718096'};
function vals(){const A=1,m=+ui.m.value,k=+ui.k.value,phi=+ui.phi.value,w=Math.sqrt(k/m),q=w*t+phi;return{A,m,k,phi,w,q,x:Math.sin(q),v:w*Math.cos(q),a:-w*w*Math.sin(q)}}
function labels(){const z=vals();$('mout').textContent=z.m.toFixed(1)+' kg';$('kout').textContent=z.k.toFixed(1)+' N/m';$('phiout').textContent=z.phi.toFixed(2)+' rad'}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}
function line(x1,y1,x2,y2,color=C.ink,w=1,d=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(d);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function text(s,x,y,size=13,color=C.ink,align='left'){ctx.save();ctx.fillStyle=color;ctx.font=size+'px "Avenir Next", Avenir, "Segoe UI", sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.restore()}
function vectorLabel(letter,x,y,color){ctx.save();ctx.fillStyle=color;ctx.font='italic 17px Georgia, serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(letter,x,y+3);const w=ctx.measureText(letter).width;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x-1,y-7);ctx.lineTo(x+w+4,y-7);ctx.stroke();ctx.beginPath();ctx.moveTo(x+w+4,y-7);ctx.lineTo(x+w,y-10);ctx.lineTo(x+w,y-4);ctx.closePath();ctx.fill();ctx.restore()}
function arrow(x1,y1,x2,y2,color,w=4){line(x1,y1,x2,y2,color,w);const a=Math.atan2(y2-y1,x2-x1),h=10;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a-.5),y2-h*Math.sin(a-.5));ctx.lineTo(x2-h*Math.cos(a+.5),y2-h*Math.sin(a+.5));ctx.closePath();ctx.fill()}
function spring(cx,y1,y2){ctx.save();ctx.strokeStyle='#59616c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,y1);const lead=10,usable=Math.max(10,y2-y1-2*lead),n=24;ctx.lineTo(cx,y1+lead);for(let i=0;i<=n;i++){const f=i/n,y=y1+lead+f*usable,x=cx+(i===0||i===n?0:(i%2?13:-13));ctx.lineTo(x,y)}ctx.lineTo(cx,y2);ctx.stroke();ctx.restore()}
function mass(cx,cy,r){const g=ctx.createRadialGradient(cx-r*.35,cy-r*.45,2,cx,cy,r);g.addColorStop(0,'#f2f2f2');g.addColorStop(.32,'#9b9b9b');g.addColorStop(1,'#111');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill()}
function graph(x0,y0,w,h,label,color,kind,show,z){text(label,x0,y0-13,15);ctx.save();ctx.beginPath();ctx.rect(x0,y0,w,h);ctx.clip();for(let i=0;i<=4;i++)line(x0,y0+i*h/4,x0+w,y0+i*h/4,C.grid,.8);line(x0,y0+h/2,x0+w,y0+h/2,'#7d8998');line(x0+w,y0,x0+w,y0+h,'#7d8998');if(show){ctx.strokeStyle=color;ctx.lineWidth=2.6;ctx.beginPath();const span=9;for(let px=0;px<=w;px++){const tau=t-span+(px/w)*span,q=z.w*tau+z.phi,n=kind==='x'?Math.sin(q):kind==='v'?Math.cos(q):-Math.sin(q),py=y0+h/2-n*h*.38;px?ctx.lineTo(x0+px,py):ctx.moveTo(x0,py)}ctx.stroke();const n=kind==='x'?z.x:kind==='v'?z.v/z.w:z.a/(z.w*z.w);ctx.fillStyle=color;ctx.beginPath();ctx.arc(x0+w,y0+h/2-n*h*.38,4.5,0,Math.PI*2);ctx.fill()}ctx.restore()}
function draw(){
const W=canvas.clientWidth,H=canvas.clientHeight,z=vals();ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
// Système masse-ressort centré au-dessus des graphiques.
const massX=W/2,eqY=235,scale=Math.min(90,Math.max(62,W*.09)),massY=eqY+z.x*scale;
line(massX-42,20,massX+42,20,'#333',4);spring(massX,22,massY-22);mass(massX,massY,22);
// Repère et position d’équilibre.
const axisX=massX-Math.min(150,W*.32),vectorScale=Math.min(1,Math.max(0,(W/2-20)/125));
line(axisX+8,eqY,massX+118*vectorScale,eqY,'#6f7a88',1,[5,5]);
arrow(axisX,eqY-82,axisX,eqY+92,C.ink,2);line(axisX-6,eqY,axisX+6,eqY,C.ink,2);
text('0',axisX-11,eqY,12,C.ink,'right');text('x',axisX+11,eqY+86,15,C.ink);
if(W<540){text("Équilibre",axisX+12,eqY-15,11,C.muted)}
else{text("Position d'équilibre",axisX-20,eqY,12,C.muted,'right')}
// Vecteurs positifs orientés vers le bas.
arrow(massX+42*vectorScale,eqY,massX+42*vectorScale,massY,C.x,4);vectorLabel('x',massX+51*vectorScale,(eqY+massY)/2,C.x);
const vy=massY+(z.v/z.w)*48;arrow(massX+72*vectorScale,massY,massX+72*vectorScale,vy,C.v,3);vectorLabel('v',massX+81*vectorScale,(massY+vy)/2,C.v);
const ay=massY+(z.a/(z.w*z.w))*48;arrow(massX+102*vectorScale,massY,massX+102*vectorScale,ay,C.a,3);vectorLabel('a',massX+111*vectorScale,(massY+ay)/2,C.a);
// Graphiques pleine largeur sous le système masse-ressort.
const gx=22,gw=Math.max(1,W-44),gh=88;
graph(gx,365,gw,gh,'Position x(t)',C.x,'x',true,z);
graph(gx,505,gw,gh,'Vitesse v(t)',C.v,'v',true,z);
graph(gx,645,gw,gh,'Accélération a(t)',C.a,'a',true,z);
text('t = '+t.toFixed(2)+' s',W-18,H-14,12,C.muted,'right');labels()}
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(playing)t+=dt*1.5;draw();requestAnimationFrame(frame)}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'❚❚':'▶';$('play').setAttribute('aria-label',playing?'Pause':'Lecture');$('play').setAttribute('aria-pressed',String(playing))};$('reset').onclick=()=>{t=0;playing=false;$('play').textContent='▶';$('play').setAttribute('aria-label','Lecture');$('play').setAttribute('aria-pressed','false');draw()};$('backstep').onclick=()=>{t-=.05;draw()};$('step').onclick=()=>{t+=.05;draw()};Object.values(ui).forEach(el=>el.addEventListener("input",draw));window.addEventListener("resize",resize);new ResizeObserver(resize).observe(canvas);resize();requestAnimationFrame(frame)})();
</script></body></html>
